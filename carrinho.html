<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Galeria de Arte - Carrinho</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; }
        header { background-color: #FFC0CB; padding: 20px; text-align: center; }
        nav { background-color: #333; padding: 10px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        main { padding: 20px; max-width: 600px; margin: auto; }
        footer { background-color: #FFC0CB; text-align: center; padding: 10px; margin-top: 40px; }
        .item-carrinho { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item-carrinho img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 4px; }
        .preco { color: #2ecc71; font-weight: bold; font-size: 1.4em; margin: 15px 0; }
        .btn-finalizar { background-color: #2ecc71; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1em; }
        .btn-finalizar:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <header>
        <h1>Galeria de Arte & Pinturas</h1>
        <p>Encontre a obra de arte perfeita para o seu espaço</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="servicos.html">Serviços</a>
        <a href="galeria.html">Galeria</a>
        <a href="contato.html">Contato</a>
        <a href="carrinho.html">Carrinho</a>
    </nav>

    <main>
        <h2>Seu Carrinho</h2>
        <div id="conteudo-carrinho" class="item-carrinho">
            <p>Carregando produto...</p>
        </div>
    </main>

    <footer>
        <p>© 2026 Galeria de Arte. Todos os direitos reservados.</p>
    </footer>

    <script>
        const conteudo = document.getElementById('conteudo-carrinho');
        const produtoSalvo = localStorage.getItem('produtoSelecionado');

        if (produtoSalvo) {
            const produto = JSON.parse(produtoSalvo);
            conteudo.innerHTML = `
                <img src="${produto.imagem}" alt="${produto.nome}">
                <h3>${produto.nome}</h3>
                <p class="preco">${produto.preco}</p>
                <button class="btn-finalizar" onclick="alert('Obrigado pela compra! Entraremos em contato.')">Finalizar Pedido</button>
            `;
        } else {
            conteudo.innerHTML = '<p>Nenhum produto selecionado. <a href="galeria.html">Voltar para a galeria</a>.</p>';
        }
    </script>

</body>
</html>
